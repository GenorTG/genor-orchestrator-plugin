<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>⚡ GenorBoard — Orchestrator Dashboard</title>
<style>
/* ═══════════════════════════════════════════════════════════
   THEME TOKENS
   ═══════════════════════════════════════════════════════════ */
[data-theme="dark"] {
  --bg: #0d1117; --bg-alt: #161b22; --bg-card: #1c2128;
  --border: #30363d; --text: #c9d1d9; --text-dim: #8b949e;
  --text-bright: #fff; --blue: #58a6ff; --green: #3fb950;
  --red: #f85149; --yellow: #d29922; --orange: #f0883e;
  --purple: #bc8cff; --cyan: #39d2c0; --pink: #f778ba;
  --accent: #58a6ff; --accent-bg: rgba(88,166,255,.1);
  --font: 'JetBrains Mono','Cascadia Code','Fira Code','Consolas',monospace;
  --font-ui: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --radius: 6px; --radius-lg: 10px; --transition: 150ms ease;
  --sidebar-w: 200px; --sidebar-icon-w: 56px;
  --header-h: 42px; --scrollbar: 6px;
}
[data-theme="light"] {
  --bg: #fff; --bg-alt: #f6f8fa; --bg-card: #fafbfc;
  --border: #d0d7de; --text: #24292f; --text-dim: #656d76;
  --text-bright: #1f2328; --blue: #0969da; --green: #1a7f37;
  --red: #cf222e; --yellow: #9a6700; --orange: #bd561d;
  --purple: #8250df; --cyan: #1b7c83; --pink: #bf3989;
  --accent: #0969da; --accent-bg: rgba(9,105,218,.08);
  --font: 'JetBrains Mono','Cascadia Code','Fira Code','Consolas',monospace;
  --font-ui: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --radius: 6px; --radius-lg: 10px; --transition: 150ms ease;
  --sidebar-w: 200px; --sidebar-icon-w: 56px;
  --header-h: 42px; --scrollbar: 6px;
}

/* ═══════════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-ui);
  font-size:14px;line-height:1.6;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{cursor:pointer;font-family:inherit;font-size:inherit}
code,.code{font-family:var(--font)}
::placeholder{color:var(--text-dim);opacity:.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:var(--radius)}

/* Scrollbar */
::-webkit-scrollbar{width:var(--scrollbar);height:var(--scrollbar)}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}

@media(prefers-reduced-motion){*,*::before,*::after{transition-duration:0ms!important;animation-duration:0ms!important}}

/* ═══════════════════════════════════════════════════════════
   SKIP LINK
   ═══════════════════════════════════════════════════════════ */
.skip-link{position:absolute;top:-100px;left:8px;z-index:9999;background:var(--accent);color:#000;padding:6px 12px;border-radius:var(--radius);font-weight:600}
.skip-link:focus{top:8px}

/* ═══════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════ */
.header{display:flex;align-items:center;height:var(--header-h);padding:0 12px;background:var(--bg-alt);border-bottom:1px solid var(--border);gap:10px;flex-shrink:0;position:relative;z-index:100}
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:18px;padding:4px;border-radius:var(--radius);line-height:1;cursor:pointer}
.logo{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--text-bright);white-space:nowrap}
.logo span{color:var(--accent)}
.header .sep{width:1px;height:16px;background:var(--border);flex-shrink:0}
.status-indicator{display:flex;align-items:center;gap:5px;font-size:13px;flex-shrink:0}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.status-dot.off{background:var(--red)}
.header-stats{display:flex;gap:10px;margin-left:auto;font-size:12px;color:var(--text-dim)}
.header-stats .s{display:flex;align-items:center;gap:3px}
.header-stats .s .n{color:var(--text-bright);font-weight:600;font-family:var(--font)}
.theme-btn{background:none;border:1px solid var(--border);border-radius:var(--radius);color:var(--text-dim);cursor:pointer;padding:2px 7px;font-size:15px;line-height:1;transition:var(--transition);flex-shrink:0}

/* ═══════════════════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════════════════ */
.layout{display:flex;height:calc(100% - var(--header-h))}
.sidebar{width:var(--sidebar-w);background:var(--bg-alt);border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;transition:width var(--transition);overflow:hidden}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;padding:8px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius);border:none;background:none;color:var(--text-dim);font-size:13px;cursor:pointer;transition:var(--transition);text-align:left;width:100%;white-space:nowrap;font-family:var(--font-ui)}
.nav-item:hover{color:var(--text);background:var(--accent-bg)}
.nav-item.active{color:var(--accent);background:var(--accent-bg);font-weight:600}
.nav-item .icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav-item .label{overflow:hidden;text-overflow:ellipsis}
.sidebar-footer{padding:8px;border-top:1px solid var(--border);font-size:12px;color:var(--text-dim);text-align:center}
.main{flex:1;overflow-y:auto;padding:20px;min-width:0}
.main.loading{display:flex;align-items:center;justify-content:center}
.main.loading::after{content:'⏳ Loading…';color:var(--text-dim);font-family:var(--font)}

/* ═══════════════════════════════════════════════════════════
   COMPONENTS
   ═══════════════════════════════════════════════════════════ */

/* Metric cards */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.metric-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;transition:var(--transition);cursor:default;position:relative}
.metric-card:hover{transform:translateY(-1px);border-color:var(--accent)}
.metric-card .mc-value{font-family:var(--font);font-size:22px;font-weight:700;color:var(--text-bright);line-height:1.2}
.metric-card .mc-label{font-size:12px;color:var(--text-dim);margin-top:2px}
.metric-card .mc-sub{font-size:12px;color:var(--text-dim);margin-top:1px}
.metric-card .mc-icon{position:absolute;top:10px;right:12px;font-size:16px;opacity:.2}

/* Section titles */
.section{margin-bottom:20px}
.section-title{font-size:14px;font-weight:600;color:var(--text-bright);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.section-title .badge{font-size:11px;background:var(--accent-bg);color:var(--accent);padding:1px 6px;border-radius:3px;font-weight:500;font-family:var(--font)}

/* Card containers */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-alt);color:var(--text);font-size:13px;font-family:var(--font-ui);cursor:pointer;transition:var(--transition)}
.btn:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.btn-primary:hover{background:var(--blue);color:#000}
.btn-sm{padding:3px 8px;font-size:12px}
.btn-icon{padding:4px;font-size:12px;line-height:1}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}

/* ═══════════════════════════════════════════════════════════
   TABLES — RESIZABLE COLUMNS, SORTING
   ═══════════════════════════════════════════════════════════ */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
#routing-table td{overflow:visible;white-space:normal}
.routing-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;margin:2px;border-radius:var(--radius);font-size:11px;background:var(--bg-card);cursor:pointer;border:1px solid var(--border);user-select:none;transition:all 120ms ease}
.routing-chip:hover{border-color:var(--blue);background:var(--accent-bg)}
.routing-chip input{accent-color:var(--blue);margin:0;width:14px;height:14px;cursor:pointer}
.routing-chip:has(input:checked){border-color:var(--blue);background:rgba(88,166,255,.18);color:var(--blue)}
.routing-grid{display:flex;flex-wrap:wrap;gap:3px;max-height:240px;overflow-y:auto;padding:2px}
.table-wrap table{width:100%;border-collapse:collapse}
th{position:relative;padding:7px 28px 7px 10px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg-alt);color:var(--text-dim);font-weight:600;font-size:12px;white-space:nowrap;user-select:none;overflow:hidden;text-overflow:ellipsis}
td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:13px;overflow:hidden;text-overflow:ellipsis}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--accent-bg)}
tr.selected td{background:var(--accent-bg)}

/* Resize handle on th — wider, visible on hover */
.th-resize{position:absolute;top:0;right:0;width:8px;height:100%;cursor:col-resize;z-index:2}
.th-resize::after{content:'';position:absolute;top:0;right:3px;width:2px;height:100%;background:var(--border);opacity:0;transition:opacity .12s}
th:hover .th-resize::after,.th-resize:active::after{opacity:1}
.th-resize:hover::after{background:var(--accent)}

/* Sortable header cursor + arrow */
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--text-bright)}
.th-sort-arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text-dim);pointer-events:none;opacity:.5}
th.sort-asc .th-sort-arrow{color:var(--accent);opacity:1}
th.sort-desc .th-sort-arrow{color:var(--accent);opacity:1}

/* Tooltip on [title] */
[title]{position:relative}
[title]:hover::after{content:attr(title);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1c2128;color:#e6edf3;padding:4px 8px;border-radius:4px;font-size:11px;white-space:nowrap;z-index:1000;border:1px solid #444c56;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
[data-theme="light"] [title]:hover::after{background:#fff;color:#24292f;border-color:#d0d7de}

/* Status badges */
.badge{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:3px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-green{background:rgba(63,185,80,.15);color:var(--green)}
.badge-red{background:rgba(248,81,73,.15);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.15);color:var(--yellow)}
.badge-blue{background:rgba(88,166,255,.15);color:var(--blue)}
.badge-gray{background:rgba(139,148,158,.15);color:var(--text-dim)}
.badge-purple{background:rgba(188,140,255,.15);color:var(--purple)}

/* Agent cards */
.agent-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-bottom:8px}
.agent-card .ac-header{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.agent-card .ac-name{font-weight:600;color:var(--text-bright)}
.agent-card .ac-task{font-size:12px;color:var(--text-dim);margin-bottom:5px;line-height:1.4}
.agent-card .ac-meta{display:flex;gap:10px;font-size:11px;color:var(--text-dim);flex-wrap:wrap}
.agent-card .ac-meta span{display:flex;align-items:center;gap:3px}

/* Activity feed */
.activity{font-size:13px}
.activity .entry{display:flex;gap:8px;padding:5px 6px;border-radius:3px;align-items:flex-start}
.activity .entry:nth-child(odd){background:rgba(48,54,61,.2)}
.activity .entry-time{font-family:var(--font);color:var(--text-dim);white-space:nowrap;width:100px;flex-shrink:0;font-size:11px;padding-top:1px}
.activity .entry-msg{word-break:break-word}
.activity .entry-lvl{font-weight:600;width:42px;flex-shrink:0;font-size:11px}

/* Log viewer */
.log-viewer{font-family:var(--font);font-size:12px;line-height:1.5}
.log-viewer .log-entry{display:flex;gap:6px;padding:2px 6px;border-radius:2px;font-size:12px}
.log-viewer .log-entry:nth-child(odd){background:rgba(48,54,61,.15)}
.log-viewer .log-entry:hover{background:var(--accent-bg)}
.log-viewer .log-time{color:var(--text-dim);flex-shrink:0;width:110px;font-size:11px}

/* Filters */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.filter-bar input,.filter-bar select{padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-alt);color:var(--text);font-size:12px;font-family:var(--font-ui);min-width:120px}
.filter-bar input:focus,.filter-bar select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.filter-bar input{flex:1;min-width:140px}

/* Toast */
.toast-container{position:fixed;top:52px;right:12px;z-index:9999;display:flex;flex-direction:column;gap:5px}
.toast{padding:7px 12px;border-radius:var(--radius);font-size:12px;background:var(--bg-card);border:1px solid var(--border);box-shadow:0 4px 12px rgba(0,0,0,.3);animation:slideIn .2s ease;display:flex;align-items:center;gap:8px;max-width:340px}
.toast-error{border-left:3px solid var(--red)}
.toast-success{border-left:3px solid var(--green)}
.toast-info{border-left:3px solid var(--blue)}
.toast .toast-close{background:none;border:none;color:var(--text-dim);font-size:12px;margin-left:auto;cursor:pointer;line-height:1;padding:2px}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* Spinner */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* Tags, empty, toggle, setting-row, modal (compact) */
.tag{display:inline-block;padding:0 5px;border-radius:3px;background:var(--accent-bg);color:var(--accent);font-size:11px;font-weight:500;margin:1px}
.empty{text-align:center;padding:24px;color:var(--text-dim);font-size:13px}

.setting-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);gap:12px}
.setting-row:last-child{border:none}
.setting-row .s-label{font-size:13px}
.setting-row .s-desc{font-size:11px;color:var(--text-dim);margin-top:1px}

.toggle{width:34px;height:18px;border-radius:9px;border:1px solid var(--border);background:var(--bg-alt);cursor:pointer;position:relative;transition:var(--transition);flex-shrink:0}
.toggle.on{background:var(--green);border-color:var(--green)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--text-bright);transition:var(--transition)}
.toggle.on::after{left:18px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:680px;width:92%;max-height:85vh;overflow-y:auto;padding:20px}
.modal-title{font-size:14px;font-weight:600;color:var(--text-bright);margin-bottom:10px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

/* Sub-tabs */
.subtabs{display:flex;gap:0;margin-bottom:10px;border-bottom:1px solid var(--border)}
.subtab{padding:5px 12px;border:none;background:none;color:var(--text-dim);font-size:12px;cursor:pointer;border-bottom:2px solid transparent;transition:var(--transition);font-family:var(--font-ui);margin-bottom:-1px}
.subtab:hover{color:var(--text)}
.subtab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* Progress bar */
.progress-bar{height:4px;background:var(--bg-alt);border-radius:2px;overflow:hidden;margin:6px 0}
.progress-bar .fill{height:100%;border-radius:2px;transition:width .3s ease}

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════════ */
@media(max-width:1023px){
  .sidebar{width:var(--sidebar-icon-w)}
  .nav-item .label{display:none}
  .nav-item{justify-content:center;padding:7px 4px}
}
@media(max-width:767px){
  .hamburger{display:block}
  .sidebar{position:fixed;top:var(--header-h);left:0;bottom:0;z-index:200;width:180px;transform:translateX(-100%);transition:transform .2s ease}
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 20px rgba(0,0,0,.4)}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199;top:var(--header-h)}
  .sidebar-backdrop.show{display:block}
  .header .logo span{display:none}
  .header-stats .s span{display:none}
  .header-stats{gap:4px}
  .metrics{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:599px){
  .main{padding:10px}
  .metrics{grid-template-columns:1fr}
  .filter-bar{flex-direction:column}
  .agent-card .ac-meta{flex-direction:column;gap:3px}
}
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>
<div id="toast-container" class="toast-container" aria-live="polite"></div>

<header class="header">
  <button class="hamburger" id="hamburger" aria-label="Toggle navigation">☰</button>
  <div class="logo">⚡ Geno<span>Board</span></div>
  <div class="sep"></div>
  <div class="status-indicator" id="status-indicator" title="Orchestrator connection status">
    <span class="status-dot off" id="status-dot"></span>
    <span class="status-text" id="status-text" style="font-size:12px">Connecting…</span>
  </div>
  <div class="header-stats" id="header-stats"></div>
  <button class="theme-btn" id="theme-btn" aria-label="Toggle theme" title="Toggle dark/light theme">🌙</button>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="sidebar-nav" id="sidebar-nav" role="tablist">
      <button class="nav-item active" data-tab="dashboard" role="tab" aria-selected="true" title="Health overview, recent activity, quick actions"><span class="icon">📊</span><span class="label">Dashboard</span></button>
      <button class="nav-item" data-tab="projects" role="tab" aria-selected="false" title="Browse and manage projects"><span class="icon">📁</span><span class="label">Projects</span></button>
      <button class="nav-item" data-tab="agents" role="tab" aria-selected="false" title="Monitor live agent sessions"><span class="icon">🤖</span><span class="label">Agents</span></button>
      <button class="nav-item" data-tab="models" role="tab" aria-selected="false" title="Model inventory, routing config, editing"><span class="icon">🧠</span><span class="label">Models</span></button>
      <button class="nav-item" data-tab="logs" role="tab" aria-selected="false" title="Orchestrator event logs with filtering"><span class="icon">📜</span><span class="label">Logs</span></button>
      <button class="nav-item" data-tab="settings" role="tab" aria-selected="false" title="Configuration, safeguards, quick actions"><span class="icon">⚙️</span><span class="label">Settings</span></button>
    </div>
    <div class="sidebar-footer" id="sidebar-footer"></div>
  </nav>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <main class="main" id="main-content" role="main" aria-live="polite"></main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   STATE & HELPERS
   ═══════════════════════════════════════════════════════════ */
const $=(s,c=document)=>c.querySelector(s);
const $$=(s,c=document)=>[...c.querySelectorAll(s)];
const API=(p,o)=>fetch('/orchestrator'+p,{headers:{Accept:'application/json'},...o}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status+': '+r.statusText);return r.json()}).catch(e=>{toast(e.message,'error');throw e});
const debounce=(f,m=300)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),m)}};
const esc=s=>{if(s===null||s===undefined)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const fmtTime=i=>{if(!i)return'—';try{return new Date(i).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch{return'—'}};
const fmtDate=i=>{if(!i)return'—';try{return new Date(i).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return'—'}};
const relTime=i=>{if(!i)return'—';const d=Date.now()-new Date(i).getTime();const m=Math.floor(d/60000);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago'};
const fmtSize=b=>b<1024?b+'B':b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(1)+'MB';

function toast(m,t='info',d=3500){
  const c=$('#toast-container');if(!c)return;
  const el=document.createElement('div');el.className='toast toast-'+t;
  const icons={error:'❌',success:'✅',info:'ℹ️'};
  el.innerHTML=`<span>${icons[t]||'ℹ️'}</span><span>${esc(m)}</span><button class="toast-close" title="Dismiss">×</button>`;
  c.appendChild(el);
  el.querySelector('.toast-close').onclick=()=>el.remove();
  if(d>0)setTimeout(()=>{if(el.parentNode)el.remove()},d);
}

/* ═══════════════════════════════════════════════════════════
   RESIZABLE + SORTABLE TABLE COLUMNS
   ═══════════════════════════════════════════════════════════
   Two-step init: measure natural widths with auto layout,
   then freeze them with fixed layout + explicit widths.
   ============================================================ */

// Store per-column widths keyed by table+column index
const _colWidths=new WeakMap();

function _freezeColWidths(table){
  // Switch to fixed layout so explicit widths actually stick
  table.style.tableLayout='fixed';
  const ths=table.querySelectorAll('th');
  const tableW=table.getBoundingClientRect().width;
  let totalTh=0;
  ths.forEach(th=>{totalTh+=th.getBoundingClientRect().width;});
  const ratio=totalTh>0?Math.min(tableW/totalTh,1.5):1;
  ths.forEach((th,i)=>{
    let w=th.getBoundingClientRect().width*ratio;
    if(w<50)w=100;
    th.style.width=Math.round(w)+'px';
  });
}

function enableCols(table){
  if(!table||table.dataset.colsEnabled)return;
  table.dataset.colsEnabled='true';

  // Step 1: let auto-layout measure natural widths, then freeze
  _freezeColWidths(table);

  // Step 2: add resize handles + sort to each th
  table.querySelectorAll('th').forEach((th,i)=>{
    // -- Resize handle --
    if(!th.querySelector('.th-resize')){
      const grip=document.createElement('div');
      grip.className='th-resize';
      grip.title='Drag to resize column';
      let sx=0,sw=0;
      grip.addEventListener('mousedown',e=>{
        e.preventDefault();e.stopPropagation();
        sx=e.clientX;sw=th.getBoundingClientRect().width;
        table.style.cursor='col-resize';
        const onMove=ev=>{const w=Math.max(50,sw+(ev.clientX-sx));th.style.width=w+'px';};
        const onUp=()=>{
          document.removeEventListener('mousemove',onMove);
          document.removeEventListener('mouseup',onUp);
          table.style.cursor='';
        };
        document.addEventListener('mousemove',onMove);
        document.addEventListener('mouseup',onUp);
      });
      th.appendChild(grip);
    }

    // -- Sort arrow + click-to-sort --
    if(!th.querySelector('.th-sort-arrow')){
      const arr=document.createElement('span');
      arr.className='th-sort-arrow';
      arr.textContent='⇅';
      th.appendChild(arr);
    }
    th.classList.add('sortable');
    th.style.cursor='pointer';
    th.title=(th.title||'')+' | Click to sort';

    // Remove old listener before adding new one to avoid duplicates
    const newTh=th.cloneNode(true);
    th.parentNode.replaceChild(newTh,th);
    newTh.addEventListener('click',()=>sortByCol(newTh));
  });
}

function sortByCol(th){
  const table=th.closest('table');
  const ths=[...table.querySelectorAll('th')];
  const idx=ths.indexOf(th);
  if(idx<0)return;

  const dir=th.classList.contains('sort-asc')?'desc':th.classList.contains('sort-desc')?'asc':'asc';
  // Reset all
  table.querySelectorAll('th').forEach(t=>{t.classList.remove('sort-asc','sort-desc');});
  th.classList.add(dir==='asc'?'sort-asc':'sort-desc');
  th.querySelector('.th-sort-arrow').textContent=dir==='asc'?'▲':'▼';

  const tbody=table.querySelector('tbody');
  if(!tbody)return;
  const rows=[...tbody.querySelectorAll('tr')];
  if(!rows.length||rows[0].children.length<=idx)return;

  const numeric=rows.every(r=>{
    const cell=r.children[idx];
    return cell&&!isNaN(parseFloat(cell.textContent.trim().replace(/,/g,'')));
  });

  const getVal=r=>{
    const c=r.children[idx];if(!c)return'';
    if(numeric)return parseFloat(c.textContent.trim().replace(/,/g,''))||0;
    // Check data-sort attribute first
    if(c.dataset.sort!==undefined)return c.dataset.sort;
    return c.textContent.trim().toLowerCase();
  };

  rows.sort((a,b)=>{
    const va=getVal(a),vb=getVal(b);
    if(typeof va==='number'&&typeof vb==='number')return dir==='asc'?va-vb:vb-va;
    const sa=String(va),sb=String(vb);
    return dir==='asc'?sa.localeCompare(sb):sb.localeCompare(sa);
  });
  rows.forEach(r=>tbody.appendChild(r));
}

/* ═══════════════════════════════════════════════════════════
   CACHE & DATA LOADING
   ═══════════════════════════════════════════════════════════ */
const CACHE={};
function loadTabData(tab,fresh){
  if(!fresh&&CACHE[tab]&&Date.now()-CACHE[tab].ts<5000)return Promise.resolve(CACHE[tab].data);
  const maps={
    dashboard:['/api/status','/api/logs?limit=10','/api/live-agents','/api/models','/api/projects','/api/config'],
    projects:['/api/projects','/api/config'],
    agents:['/api/live-agents'],
    models:['/api/models'],
    logs:['/api/logs?limit=100'],
    settings:['/api/config','/api/status','/api/safeguard-log'],
  };
  const paths=maps[tab]||[];
  return Promise.allSettled(paths.map(p=>API(p))).then(results=>{
    const data={};
    results.forEach((r,i)=>{if(r.status==='fulfilled')data[paths[i]]=r.value});
    CACHE[tab]={data,ts:Date.now()};
    return data;
  });
}

/* ═══════════════════════════════════════════════════════════
   GLOBAL ROUTING — populates chip grids + saves to default_model_routing
   ═══════════════════════════════════════════════════════════ */
window.populateGlobalRouting=async function(){
  try{
    const cfg=await API('/api/config');
    const globalRouting=cfg.default_model_routing||{};
    const md=await API('/api/models');
    const allModels=(md.models||[]).map(m=>m.id||m.name||m);
    document.querySelectorAll('.global-routing-models').forEach(el=>{
      const cat=el.dataset.cat;
      const selected=globalRouting[cat]||[];
      el.innerHTML=allModels.map(m=>`<label class="routing-chip"><input type="checkbox" value="${esc(m)}" data-gcat="${esc(cat)}" ${selected.includes(m)?'checked':''}><span>${esc(m)}</span></label>`).join('');
    });
  }catch(e){toast('Failed to load global routing: '+e.message,'error');}
};

window.saveGlobalRouting=async function(){
  const btn=document.querySelector('#global-routing-grid .btn-primary');if(!btn)return;
  btn.disabled=true;btn.textContent='Saving…';
  const msg=document.getElementById('global-routing-msg');if(msg)msg.textContent='';
  const default_model_routing={};
  document.querySelectorAll('.global-routing-models').forEach(el=>{
    const cat=el.dataset.cat;
    const checked=[...el.querySelectorAll('.routing-chip input:checked')].map(cb=>cb.value);
    if(checked.length)default_model_routing[cat]=checked;
  });
  try{
    const r=await API('/api/config',{method:'POST',body:JSON.stringify({default_model_routing}),headers:{'Content-Type':'application/json'}});
    if(r&&r.ok){if(msg)msg.textContent='Saved ✓';toast('Global routing saved','success');}else throw new Error(r?.error||'Save failed');
  }catch(e){if(msg)msg.textContent='Error: '+e.message;toast(e.message,'error');}
  finally{btn.disabled=false;btn.textContent='💾 Save Global Routing';}
};

function formatTok(t){if(!t||(!t.input&&!t.output))return'—';return(t.input||0).toLocaleString()+' in / '+(t.output||0).toLocaleString()+' out'}
function calcDur(s,e){if(!s||!e)return null;const st=new Date(s).getTime(),et=new Date(e).getTime();if(isNaN(st)||isNaN(et)||et<st)return null;const ms=et-st;if(ms<60000)return Math.round(ms/1000)+'s';if(ms<3600000)return Math.floor(ms/60000)+'m';return Math.floor(ms/3600000)+'h'}

window.showSessionDetail=function(s){
  const started=s.started_at||s.start_time;const ended=s.ended_at||s.end_time;
  const sameStamp=started&&ended&&Math.abs(new Date(started).getTime()-new Date(ended).getTime())<1000;
  const dur=s.duration||(sameStamp?null:calcDur(started,ended))||'—';
  const legacy=(sameStamp||dur==='—')?'<div style="margin-bottom:8px;padding:6px 8px;background:rgba(248,81,73,0.08);border:1px solid var(--red);border-radius:6px;font-size:12px;color:var(--red)">⚠️ Legacy session — timestamps unreliable</div>':'';
  const wf=s.workflow||{};const ah=s.action_history||[];const tf=s.touched_files||[];
  const tu=s.token_usage||null;const qh=s.qa_history||[];const qf=s.qa_findings||[];
  const err=s.last_error||null;
  const hasRich=ah.length||tf.length||tu||qh.length||qf.length||err||(wf.phase_history&&wf.phase_history.length);
  showModal('📋 '+esc(s.goal||s.task||'Session'),legacy+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-bottom:10px;font-size:13px">'+
    '<div><span style="color:var(--text-dim);display:block;font-size:11px">Agent</span><span style="font-weight:500">'+esc(s.agent||'—')+'</span></div>'+
    '<div><span style="color:var(--text-dim);display:block;font-size:11px">Model</span><span style="font-weight:500">'+esc(s.model||'—')+'</span></div>'+
    '<div><span style="color:var(--text-dim);display:block;font-size:11px">Status</span><span class="badge badge-'+(s.status==='qa'?'yellow':s.status==='done'?'green':s.status==='failed'?'red':'yellow')+'">'+(s.status||'—')+'</span></div>'+
    '<div><span style="color:var(--text-dim);display:block;font-size:11px">Duration</span><span style="font-weight:500">'+(dur||'—')+'</span></div>'+
    (started&&!sameStamp?'<div><span style="color:var(--text-dim);display:block;font-size:11px">Started</span>'+new Date(started).toLocaleString()+'</div>':'')+
    (ended&&!sameStamp?'<div><span style="color:var(--text-dim);display:block;font-size:11px">Ended</span>'+new Date(ended).toLocaleString()+'</div>':'')+
    (tu?'<div style="grid-column:1/-1"><span style="color:var(--text-dim);display:block;font-size:11px">Tokens</span><span>💰 '+formatTok(tu)+'</span></div>':'')+
    (s.error_count?'<div><span style="color:var(--text-dim);display:block;font-size:11px">Errors</span><span class="badge badge-red">'+s.error_count+'</span></div>':'')+
    '<div style="grid-column:1/-1"><span style="color:var(--text-dim);display:block;font-size:11px">Task</span><span>'+esc(s.task||'—')+'</span></div>'+
    (wf&&wf.phase_history&&wf.phase_history.length?'<div style="grid-column:1/-1;margin-top:4px;border-top:1px solid var(--border);padding-top:6px"><span style="color:var(--text-dim);display:block;font-weight:600;font-size:11px;margin-bottom:4px">🔄 Workflow Phases</span>'+
      wf.phase_history.map(p=>'<span class="badge '+(p.status==='completed'?'badge-green':p.status==='current'?'badge-yellow':'badge-gray')+'" style="margin:1px;font-size:11px">'+esc(p.phase)+(p.status==='completed'?' ✅':'')+'</span>').join('')+'</div>':'')+
    (ah.length?'<div style="grid-column:1/-1;margin-top:4px;border-top:1px solid var(--border);padding-top:6px"><span style="color:var(--text-dim);display:block;font-weight:600;font-size:11px;margin-bottom:4px">⚡ Actions ('+ah.length+')</span>'+
      '<div style="max-height:120px;overflow-y:auto;border:1px solid var(--border);border-radius:4px">'+
      ah.slice(-20).map(a=>{
        let t='';try{t=new Date(a.ts).toLocaleTimeString();}catch{t=a.ts||'';}
        return '<div style="display:flex;gap:6px;padding:2px 6px;font-size:12px;border-bottom:1px solid var(--border)"><span style="color:var(--text-dim);white-space:nowrap">'+t+'</span><span>'+esc(a.action)+(a.file?' <span style="color:var(--text-dim)">→ '+esc(a.file)+'</span>':'')+'</span></div>';
      }).join('')+'</div></div>':'')+
    (tf.length?'<div style="grid-column:1/-1;margin-top:4px;border-top:1px solid var(--border);padding-top:6px"><span style="color:var(--text-dim);display:block;font-weight:600;font-size:11px;margin-bottom:4px">📄 Files ('+tf.length+')</span>'+
      '<div style="max-height:80px;overflow-y:auto;font-size:12px;color:var(--text-dim)">'+tf.map(f=>'<div style="padding:1px 4px">📄 '+esc(f)+'</div>').join('')+'</div></div>':'')+
    (qh.length?'<div style="grid-column:1/-1;margin-top:4px;border-top:1px solid var(--border);padding-top:6px"><span style="color:var(--text-dim);display:block;font-weight:600;font-size:11px;margin-bottom:4px">🔍 QA History</span>'+
      qh.map(e=>'<div style="display:flex;gap:6px;padding:4px 6px;border-left:2px solid '+(e.event==='approve'?'var(--green)':e.event==='reject'?'var(--red)':'var(--yellow)')+';margin-bottom:4px;background:var(--bg-alt);border-radius:0 4px 4px 0;font-size:12px">'+
        '<span>'+(e.event==='approve'?'✅':e.event==='reject'?'❌':'📝')+'</span>'+
        '<div><span style="font-weight:600">'+(e.event==='approve'?'Approved':e.event==='reject'?'Rejected':'Submitted')+'</span>'+
        (e.detail?'<div style="color:var(--text-dim)">'+esc(e.detail)+'</div>':'')+'</div></div>').join('')+'</div>':'')+
    (err?'<div style="grid-column:1/-1;margin-top:4px;border-top:1px solid var(--border);padding-top:6px"><span style="color:var(--text-dim);display:block;font-weight:600;color:var(--red);font-size:11px;margin-bottom:4px">❌ Last Error</span>'+
      '<pre style="background:var(--bg-alt);padding:6px 8px;border-radius:4px;font-size:12px;color:var(--red);max-height:80px;overflow:auto;margin:0">'+esc(err)+'</pre></div>':'')+
    (s.notes&&!hasRich?'<div style="grid-column:1/-1;margin-top:4px"><span style="color:var(--text-dim);display:block;font-weight:600;font-size:11px">📝 Notes</span><pre style="background:var(--bg-alt);padding:6px 8px;border-radius:4px;font-size:12px;max-height:100px;overflow:auto;margin:0">'+esc(s.notes)+'</pre></div>':'')+
    '</div>');
};

/* ═══════════════════════════════════════════════════════════
   TAB MANAGEMENT
   ═══════════════════════════════════════════════════════════ */
let currentTab='dashboard';

function activateTab(tabId){
  if(currentTab===tabId&&renderedTabs.has(tabId))return;
  currentTab=tabId;
  $$('.nav-item').forEach(el=>{const a=el.dataset.tab===tabId;el.classList.toggle('active',a);el.setAttribute('aria-selected',a?'true':'false');});
  if(location.hash!=='#'+tabId)history.replaceState(null,'','#'+tabId);
  const main=$('#main-content');main.className='main loading';
  loadTabData(tabId).then(data=>{
    renderActiveTab(tabId,data);renderedTabs.add(tabId);main.className='main';
  }).catch(()=>{main.className='main';toast('Failed to load '+tabId+' data','error');});
}

function renderActiveTab(tabId,data){
  const main=$('#main-content');
  const renders={dashboard:renderDashboard,projects:renderProjects,agents:renderAgents,models:renderModels,logs:renderLogs,settings:renderSettings};
  main.innerHTML=(renders[tabId]||renderDashboard)(data);

  // Enable resize + sort on all tables in this panel
  setTimeout(()=>{
    main.querySelectorAll('.table-wrap table').forEach(enableCols);
  },50);

  if(tabId==='dashboard'){
    API('/api/all').then(a=>{const e=$('#metric-sessions');if(e)e.textContent=a.sessions?.length||0;}).catch(()=>{});
  }
  if(tabId==='settings'){
    setTimeout(populateGlobalRouting,100);
  }
}

function refreshTab(tabId){loadTabData(tabId,true).then(d=>renderActiveTab(tabId,d));}

async function showProject(name){
  const main=$('#main-content');main.innerHTML=`<div class="loading"></div>`;

    const [state,errors]=await Promise.allSettled([
      API('/api/project-state?name='+encodeURIComponent(name)),
      API('/api/project-errors?project='+encodeURIComponent(name)),
    ]);
    const st=state.status==='fulfilled'?state.value:{};
    const sessions=st.sessions||[];const config=st.config||{};
    const rev=[...sessions].reverse();
    window._projState={name,sessions,rev,st,config,tab:'sessions'};

    function renderTabBar(active){
      return '<div class="subtabs">'+
        [{id:'sessions',l:'Sessions'},{id:'settings',l:'Settings'},{id:'routing',l:'Routing'},{id:'docs',l:'Docs'}]
        .map(t=>`<button class="subtab ${active===t.id?'active':''}" onclick="showProjTab('${t.id}')">${t.l}</button>`).join('')+'</div>';
    }

    const revSessions=rev;
    window._projSessions=revSessions;

      const bc=s.status==='qa'?'badge-yellow':s.status==='done'?'badge-green':s.status==='failed'?'badge-red':'badge-yellow';

        <td><span class="badge ${bc}">${s.status||'—'}</span></td>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${esc(s.goal||s.task||'—')}</td>
        <td title="${new Date(s.start_time||s.started_at||new Date()).toLocaleString()}">${fmtDate(s.start_time||s.started_at)}</td>
        <td title="Duration">${s.duration&&s.duration!=='0s'?s.duration:'—'}</td>
      </tr>`;
    }).join('');
    if(!revSessions.length) sessRows='<tr><td colspan="7" class="empty">No sessions</td></tr>';

    main.innerHTML=`<button class="btn btn-sm" onclick="activateTab('projects')" style="margin-bottom:8px" title="Back to project list">← Back</button>
      <div class="section-title">📁 ${esc(name)} <span class="badge">${sessions.length}</span></div>

        <div class="metric-card"><div class="mc-value" style="font-size:15px">${config.workflow?.current_phase||'—'}</div><div class="mc-label">Phase</div></div>

        <div class="metric-card"><div class="mc-value" style="font-size:15px">${st.errors?.length||0}</div><div class="mc-label">Errors</div></div>
        <div class="metric-card"><div class="mc-value" style="font-size:15px">${config.routing_preset||'default'}</div><div class="mc-label">Routing</div></div>
      </div>
      ${renderTabBar('sessions')}
      <div id="proj-tab-content">
        <div class="section-title">Sessions <span class="badge">${sessions.length}</span></div>
        <div class="filter-bar">
          <input type="text" id="proj-session-search" placeholder="🔍 Search sessions…" oninput="filterProjSessions()" title="Filter sessions by task text">

        </tr></thead><tbody>${sessRows}</tbody></table></div>

window.showProjTab=async function(tab){
  const ps=window._projState;if(!ps)return;
  const content=$('#proj-tab-content');if(!content)return;

  // Re-fetch for data-dependent tabs
  if(tab!=='sessions'&&tab!=='docs'){
    try{const state=await API('/api/project-state?name='+encodeURIComponent(ps.name));
    if(state&&state.config){ps.config=state.config||{};ps.sessions=state.sessions||ps.sessions;ps.rev=[...ps.sessions].reverse();}
    }catch(e){}
  }

  // Update active tab in sub-bar
  const subBtns=content.closest('#main-content')?.querySelectorAll('.subtab');
  if(subBtns) subBtns.forEach(b=>b.classList.toggle('active',b.textContent.trim().toLowerCase()===tab));

  if(tab==='sessions'){
    const rev=ps.rev||[];
    window._projSessions=rev;
    const rows=rev.map((s,i)=>{
      const bc=s.status==='qa'?'badge-yellow':s.status==='done'?'badge-green':s.status==='failed'?'badge-red':'badge-yellow';
      return `<tr class="sess-row" style="cursor:pointer" onclick="showSessionDetail(window._projSessions[${i}])" data-status="${s.status||''}" data-task="${esc(s.goal||s.task||'').toLowerCase()}">
        <td><code style="font-size:11px">${esc(s.id||s.session_key||'').slice(0,20)}</code></td>
        <td>${esc(s.agent||'—')}</td><td><span class="tag">${esc(s.model||'—')}</span></td>
        <td><span class="badge ${bc}">${s.status||'—'}</span></td>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${esc(s.goal||s.task||'—')}</td>
        <td>${fmtDate(s.start_time||s.started_at)}</td><td>${s.duration&&s.duration!=='0s'?s.duration:'—'}</td>
      </tr>`;
    }).join('');
    content.innerHTML=`<div class="section-title">Sessions <span class="badge">${rev.length}</span></div>
      <div class="filter-bar"><input type="text" id="proj-session-search" placeholder="🔍 Search sessions…" oninput="filterProjSessions()">
      <select id="proj-session-status" onchange="filterProjSessions()"><option value="">All</option><option value="done">done</option><option value="running">running</option><option value="failed">failed</option></select></div>
      <div class="table-wrap"><table><thead><tr><th>ID</th><th>Agent</th><th>Model</th><th>Status</th><th>Task</th><th>Started</th><th>Duration</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">No sessions</td></tr>'}</tbody></table></div>`;
  } else if(tab==='settings'){
    const docs=ps.config||{};const wf=docs.workflow||{};
    content.innerHTML=`<div class="section-title">⚙️ Settings</div>
      <div class="card">${[
        ['Free-only mode','Only use free models','free_only',docs.free_only,()=>toggleProjSetting(ps.name,'free_only',!docs.free_only)],
        ['Workflow enabled','Enforce phase workflow','workflow_enabled',wf.enabled,()=>toggleProjSetting(ps.name,'workflow_enabled',!wf.enabled)],
        ['Include QA','Require QA review phase','workflow_include_qa',wf.include_qa,()=>toggleProjSetting(ps.name,'workflow_include_qa',!wf.include_qa)],
        ['Auto Commit','Auto-commit on phase advance','workflow_auto_commit',wf.auto_commit,()=>toggleProjSetting(ps.name,'workflow_auto_commit',!wf.auto_commit)],
      ].map(r=>`<div class="setting-row"><div><div class="s-label">${r[0]}</div><div class="s-desc">${r[1]}</div></div>
        <button class="toggle ${r[3]?'on':''}" onclick="(${r[4].toString()})()" title="Toggle ${r[2]}"></button></div>`).join('')}
      </div>`;
  } else if(tab==='routing'){
    const cfg=ps.config||{};
    const projRouting=cfg.model_routing||{};
    const globalRouting=cfg.default_model_routing||{};
    const allCats=['coding','fixing','research','qa','documentation','test'];
    const catsWithRouting=allCats.filter(c=>projRouting[c]?.length||globalRouting[c]?.length);
    content.innerHTML=`<div class="section-title">🧠 Model Routing <span class="badge">${cfg.routing_preset||'custom'}</span></div>
      <div class="card" style="margin-bottom:10px">
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px">
          <div><span style="color:var(--text-dim);font-size:11px">Routing Preset</span><br><span class="badge badge-blue">${cfg.routing_preset||'default'}</span></div>
          <div><span style="color:var(--text-dim);font-size:11px">Free Only</span><br>${cfg.free_only?'<span class="badge badge-yellow">Yes</span>':'<span class="badge badge-green">No</span>'}</div>
          <div><span style="color:var(--text-dim);font-size:11px">Single Provider</span><br><span>${cfg.routing_single_provider||'—'}</span></div>
          <div><span style="color:var(--text-dim);font-size:11px">Allowlist</span><br><span>${cfg.model_allowlist?.length||0} models</span></div>
          <div><span style="color:var(--text-dim);font-size:11px">Inherit</span><br><span style="font-size:11px;color:var(--text-dim)">Unchecked categories use global defaults</span></div>
        </div>
        <button class="btn btn-sm btn-primary" id="routing-save-btn" onclick="saveRouting('${esc(ps.name)}')" style="margin-top:8px">💾 Save Routing</button>
        <span id="routing-save-msg" style="margin-left:8px;font-size:12px;color:var(--text-dim)"></span>
      </div>
      ${catsWithRouting.length>0?`
      <div class="section-title" style="font-size:13px">Per-Category Routing <span class="badge">${catsWithRouting.length}</span></div>
      <div style="margin-bottom:8px;font-size:11px;color:var(--text-dim)">Override = project-specific model chain. Inherited = uses global defaults. Click chip to toggle.</div>
      <div class="table-wrap"><table id="routing-table" class="routing-editor"><thead><tr>
        <th title="Task category" style="width:100px">Category</th><th title="Source: project override or global default" style="width:70px">Source</th><th title="Model chain for this category (first = primary, rest = fallbacks)">Model Chain (primary ⇢ fallback)</th>
      </tr></thead><tbody>${allCats.map(cat=>{
        const isOverride=!!(projRouting[cat]?.length);
        const chain=projRouting[cat]||globalRouting[cat]||[];
        return `<tr data-cat="${esc(cat)}" class="routing-cat-row">
          <td><span class="badge badge-purple">${esc(cat)}</span></td>
          <td><span class="badge ${isOverride?'badge-blue':'badge-gray'}" style="font-size:10px">${isOverride?'Override':'Inherited'}</span></td>
          <td class="routing-models" data-cat="${esc(cat)}" data-override="${isOverride}">
            <div class="routing-grid">${chain.length?`[loading]`:`<span style="color:var(--text-dim);font-size:11px">No models assigned</span>`}</div>
          </td>
        </tr>`;
      }).join('')}</tbody></table></div>
      `:'<div class="empty">No routing configured — set global defaults in ⚙️ Settings</div>'}
      ${cfg.model_allowlist?.length?`<div class="card" style="margin-top:8px">
        <div class="section-title" style="font-size:13px">🔒 Model Allowlist</div>
        <div>${cfg.model_allowlist.map(m=>`<span class="tag" title="Whitelisted model">${esc(m)}</span>`).join('')}</div>
      </div>`:''}
    `;
    // Fetch model list and populate checkboxes with inheritance UI
    (async()=>{
      try{
        const md=await API('/api/models');
        const allModels=(md.models||[]).map(m=>m.id||m.name||m);
        document.querySelectorAll('.routing-models').forEach(td=>{
          const cat=td.dataset.cat;
          const isOverride=td.dataset.override==='true';
          const chain=projRouting[cat]||globalRouting[cat]||[];
          const globalChain=globalRouting[cat]||[];
          // Show chips with override/inherit styling
          const chipHtml=allModels.map((m,i)=>{
            const checked=chain.includes(m);
            const disabled=!isOverride;  // inherit mode = read-only
            return `<label class="routing-chip ${checked?'checked':''} ${disabled?'routing-chip-inherited':''}" style="${disabled&&checked?'opacity:0.65':''}">
              <input type="checkbox" value="${esc(m)}" data-cat="${esc(cat)}" ${checked?'checked':''} ${disabled?'disabled':''}>
              <span>${esc(m)}</span>
            </label>`;
          }).join('');
          // Source info + action button
          const sourceLabel=isOverride?'Override':'Inherited';
          td.innerHTML='<div style="margin-bottom:4px">'+
            (isOverride
              ? `<button class="btn btn-xs" onclick="inheritRoutingCat('${esc(ps.name)}','${esc(cat)}')" title="Remove project override for this category — uses global defaults">↩ Use Global</button>`
              : `<button class="btn btn-xs" onclick="overrideRoutingCat('${esc(ps.name)}','${esc(cat)}')" title="Create project-specific override">↗ Override</button>`
            )+
            ` <span style="font-size:11px;color:var(--text-dim);margin-left:4px">${isOverride?'Project chain — first model = primary, rest = fallbacks':'Inherited from global defaults'}</span>`+
            '</div><div class="routing-grid" style="position:relative">'+chipHtml+'</div>';
        });
      }catch(e){toast('Failed to load models: '+e.message,'error');}
    })();
    setTimeout(()=>content.querySelectorAll('.table-wrap table').forEach(enableCols),50);
  } else if(tab==='docs'){
    // Read state from API to check which docs exist
    content.innerHTML='<div class="section-title">📄 Project Docs</div>'+
      '<div style="margin-bottom:8px;color:var(--text-dim);font-size:11px">Project documents — click to view</div>'+
      '<div style="display:flex;flex-direction:column;gap:8px">'+
        '<div><b style="font-size:11px;color:var(--text)">📋 Planning</b><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">'+
          [
            {id:'PROJECT_PLAN',l:'Project Plan',desc:'Vision, goals, milestones'},
            {id:'FEATURES',l:'Features',desc:'Planned/in-progress/completed'},
            {id:'CHANGELOG',l:'Changelog',desc:'What changed over time'},
          ].map(d=>`<button class="btn btn-sm doc-tab-btn" id="doc-btn-${d.id}" onclick="showDocTab('${esc(ps.name)}','${d.id}')" title="${esc(d.desc)}" style="font-size:11px">${esc(d.l)}</button>`).join('')+'</div></div>'+
        '<div><b style="font-size:11px;color:var(--text)">🐛 Issues</b><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">'+
          [
            {id:'BUGS',l:'Bugs & Issues',desc:'Known bugs, fixed issues, limitations'},
          ].map(d=>`<button class="btn btn-sm doc-tab-btn" id="doc-btn-${d.id}" onclick="showDocTab('${esc(ps.name)}','${d.id}')" title="${esc(d.desc)}" style="font-size:11px">${esc(d.l)}</button>`).join('')+'</div></div>'+
        '<div><b style="font-size:11px;color:var(--text)">🏛️ Architecture</b><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">'+
          [
            {id:'ARCHITECTURE',l:'Architecture',desc:'System design, data flow, patterns'},
            {id:'STYLE_GUIDE',l:'Style Guide',desc:'Code conventions, design language'},
          ].map(d=>`<button class="btn btn-sm doc-tab-btn" id="doc-btn-${d.id}" onclick="showDocTab('${esc(ps.name)}','${d.id}')" title="${esc(d.desc)}" style="font-size:11px">${esc(d.l)}</button>`).join('')+'</div></div>'+
        '<div><b style="font-size:11px;color:var(--text)">⚙️ Orchestrator</b><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">'+
          [
            {id:'STATE',l:'State',desc:'Computed project state'},
            {id:'ROADMAP',l:'Roadmap',desc:'Project roadmap'},
            {id:'CONTEXT',l:'Context',desc:'Project context'},
            {id:'NOTES',l:'Notes',desc:'General notes'},
            {id:'RECOVERY',l:'Recovery',desc:'Recovery/handoff'},
          ].map(d=>`<button class="btn btn-sm doc-tab-btn" id="doc-btn-${d.id}" onclick="showDocTab('${esc(ps.name)}','${d.id}')" title="${esc(d.desc)}" style="font-size:11px">${esc(d.l)}</button>`).join('')+'</div></div>'+
      '</div>'+
      '<div id="doc-content" style="margin-top:10px;background:var(--bg-alt);padding:12px;border-radius:var(--radius);font-size:12px;font-family:var(--font);white-space:pre-wrap;max-height:500px;overflow:auto;border:1px solid var(--border)"><span style="color:var(--text-dim)">Select a doc above</span></div>';
  }
  // Update subtitle active
  const btns=document.getElementById('main-content')?.querySelectorAll('.subtab');
  if(btns) btns.forEach(b=>b.classList.toggle('active',b.textContent.trim().toLowerCase()===tab));
  // Enable cols
  setTimeout(()=>{content.querySelectorAll('.table-wrap table').forEach(enableCols);},50);
};

window.saveRouting=async function(project){
  const btn=document.getElementById('routing-save-btn');if(!btn)return;
  btn.disabled=true;btn.textContent='Saving…';
  const msgEl=document.getElementById('routing-save-msg');if(msgEl)msgEl.textContent='';
  const modelRouting={};
  document.querySelectorAll('#routing-table tbody tr[data-cat]').forEach(tr=>{
    const cat=tr.dataset.cat;
    const checked=[...tr.querySelectorAll('.routing-chip input:checked')].map(cb=>cb.value);
    if(checked.length)modelRouting[cat]=checked;
  });
  try{
    const r=await API('/api/update-project-workflow',{method:'POST',body:JSON.stringify({project,model_routing:modelRouting}),headers:{'Content-Type':'application/json'}});
    if(r&&r.ok){if(msgEl)msgEl.textContent='Saved ✓';toast('Routing saved','success');}else{throw new Error(r?.error||'Save failed');}
  }catch(e){if(msgEl)msgEl.textContent='Error: '+e.message;toast(e.message,'error');}
  finally{btn.disabled=false;btn.textContent='💾 Save Routing';}
};

window.showDocTab=async function(project,docName){
  $$('.doc-tab-btn').forEach(b=>b.classList.remove('btn-primary'));
  const btn=document.getElementById('doc-btn-'+docName);if(btn)btn.classList.add('btn-primary');
  const content=document.getElementById('doc-content');if(!content)return;
  content.innerHTML='Loading...';
  try{
    const r=await API('/api/project-doc?name='+encodeURIComponent(project)+'&file='+docName+'.md');
    content.innerHTML=r&&r.content?esc(r.content):'<span style="color:var(--text-dim)">(empty)</span>';
  }catch(e){content.innerHTML='<span style="color:var(--red)">Error: '+esc(e.message)+'</span>';}
};

// Override/inherit helpers for per-project routing
window.overrideRoutingCat=async function(project,cat){
  // Copy global chain to project override so user can edit it
  const cfg=await API('/api/config');
  const globalChain=(cfg.default_model_routing||{})[cat]||[];
  const body={project,model_routing:{}};
  body.model_routing[cat]=globalChain.length?globalChain:[];  // empty = starts with none checked
  await API('/api/update-project-workflow',{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});
  toast('Override created for '+cat,'success');
  showProjTab('routing');
};

window.inheritRoutingCat=async function(project,cat){
  // Remove project override (set to null = delete)
  const body={project,model_routing:{}};
  body.model_routing[cat]=null;
  await API('/api/update-project-workflow',{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});
  toast('Now inheriting global default for '+cat,'success');
  showProjTab('routing');
};

window.toggleProjSetting=async function(project,key,value){
  try{
    const body={project};
    if(key==='free_only')body.free_only=value;
    else if(key.startsWith('workflow_')){body.workflow={};const k=key.replace('workflow_','');if(k==='enabled')body.workflow.enabled=value;else if(k==='include_qa')body.workflow.include_qa=value;else if(k==='auto_commit')body.workflow.auto_commit=value;}
    const r=await API('/api/update-project-workflow',{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});
    if(r&&r.ok){toast('Updated','success');showProjTab('settings');}else toast('Failed','error');
  }catch(e){toast(e.message,'error');}
};

/* ═══════════════════════════════════════════════════════════
   MODAL SYSTEM
   ═══════════════════════════════════════════════════════════ */
window.showModal=function(t,b,actionsHtml){
  const o=document.createElement('div');o.className='modal-overlay';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
  o.innerHTML='<div class="modal"><div class="modal-title">'+esc(t)+'</div>'+b+(actionsHtml?'<div class="modal-actions">'+actionsHtml+'</div>':'<div class="modal-actions"><button class="btn btn-sm" onclick="closeModal()">Close</button></div>')+'</div>';
  document.body.appendChild(o);o.addEventListener('click',function(e){if(e.target===o)closeModal()});
};
window.closeModal=function(){const e=document.querySelector('.modal-overlay');if(e)e.remove();};

window.showModelEdit=function(row){
  try{
    var m=JSON.parse(row.getAttribute('data-json'));
    var cost=m.cost||{};var routingHints=(m.routing_hints||[]).join(', ');
    showModal('🧠 '+esc(m.id),
      '<div style="display:flex;flex-direction:column;gap:6px;font-size:13px">'+
      ['Description','context_window','routing_hints'].map(f=>`<label style="color:var(--text-dim);font-size:11px">${f}</label><input id="med-${f}" value="${esc(m[f]??'')}" style="background:var(--bg-alt);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:4px 6px;font:inherit;font-size:12px">`).join('')+
      '<label style="color:var(--text-dim);font-size:11px">Cost Type</label>'+
      `<select id="med-cost-type" style="background:var(--bg-alt);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:4px 6px;font:inherit;font-size:12px">`+
        ['free','payg','subscription','unknown'].map(o=>`<option value="${o}" ${(cost.type||'unknown')===o?'selected':''}>${o}</option>`).join('')+'</select>'+
      '<label style="color:var(--text-dim);font-size:11px">Status</label>'+
      `<select id="med-status" style="background:var(--bg-alt);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:4px 6px;font:inherit;font-size:12px">`+
        ['active','discovered','offline','removed'].map(s=>`<option value="${s}" ${m.status===s?'selected':''}>${s}</option>`).join('')+'</select>'+
      '</div>',
      `<button class="btn btn-primary btn-sm" onclick="saveModelEdit('${esc(m.id)}')">💾 Save</button>`);
  }catch(e){toast('Failed to load model: '+e.message,'error');}
};

window.saveModelEdit=async function(id){
  try{
    const body={
      id,description:$('#med-description')?.value||'',context_window:$('#med-context_window')?.value||'',
      cost:{type:$('#med-cost-type')?.value||'unknown',amount:parseFloat($('#med-cost-amt')?.value)||0},
      routing_hints:($('#med-routing_hints')?.value||'').split(',').map(s=>s.trim()).filter(Boolean),
      status:$('#med-status')?.value||'active',
    };
    const r=await API('/api/models',{method:'PATCH',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});
    if(r&&r.ok){toast('Model updated','success');closeModal();refreshTab(currentTab);}else toast('Failed','error');
  }catch(e){toast(e.message,'error');}
};

/* ═══════════════════════════════════════════════════════════
   CONFIG TOGGLES & QUICK ACTIONS
   ═══════════════════════════════════════════════════════════ */
async function toggleConfig(key){
  try{
    const cfg=await API('/api/config');let body={};
    if(key==='free_only_mode')body={free_only_mode:!cfg.free_only_mode};
    else if(key==='safeguards_enabled')body={safeguards:{...cfg.safeguards||{},enabled:!cfg.safeguards?.enabled}};
    else if(key==='auto_recover')body={safeguards:{...cfg.safeguards||{},auto_recover:!cfg.safeguards?.auto_recover}};
    await API('/api/config',{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});
    toast('Config updated','success');refreshTab('settings');
  }catch(e){toast('Failed: '+e.message,'error')}
}

async function quickAction(action){
  try{
    toast('Running '+action+'…','info',10000);
    if(action==='doctor')await API('/api/quick-action',{method:'POST',body:JSON.stringify({action:'doctor'}),headers:{'Content-Type':'application/json'}});
    else if(action==='auto-populate')await API('/api/auto-populate',{method:'POST'});
    else if(action==='fix-docs')await API('/api/quick-action',{method:'POST',body:JSON.stringify({action:'fix-docs'}),headers:{'Content-Type':'application/json'}});
    toast('✅ '+action+' completed','success');refreshTab(currentTab);
  }catch(e){toast(action+' failed: '+e.message,'error')}
}

/* ═══════════════════════════════════════════════════════════
   HASH ROUTING, THEME, INIT
   ═══════════════════════════════════════════════════════════ */
function routeFromHash(){const h=location.hash.slice(1)||'dashboard';return['dashboard','projects','agents','models','logs','settings'].includes(h)?h:'dashboard';}
function initTheme(){const s=localStorage.getItem('genorboard-theme')||'dark';document.documentElement.setAttribute('data-theme',s);$('#theme-btn').textContent=s==='dark'?'🌙':'☀️';}
function toggleTheme(){const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('genorboard-theme',n);$('#theme-btn').textContent=n==='dark'?'🌙':'☀️';}

document.addEventListener('DOMContentLoaded',()=>{
  initTheme();$('#theme-btn').onclick=toggleTheme;
  $$('.nav-item').forEach(el=>{el.onclick=()=>activateTab(el.dataset.tab);});
  window.addEventListener('hashchange',()=>{const t=routeFromHash();if(t!==currentTab)activateTab(t);});
  $('#hamburger').onclick=()=>{$('#sidebar').classList.toggle('open');$('#sidebar-backdrop').classList.toggle('show');};
  $('#sidebar-backdrop').onclick=()=>{$('#sidebar').classList.remove('open');$('#sidebar-backdrop').classList.remove('show');};
  activateTab(routeFromHash());refreshHeader();
  setInterval(refreshHeader,15000);
  setInterval(()=>{if(currentTab==='dashboard'||currentTab==='agents')refreshTab(currentTab);},10000);
  API('/api/status').then(d=>{if(d&&d.version)$('#sidebar-footer').textContent='v'+d.version+' | genor-orchestrator';});
});
</script>
