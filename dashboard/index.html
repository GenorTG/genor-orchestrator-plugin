<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>⚡ GenorBoard — Orchestrator Dashboard</title>
<style>
/* ═══════════════════════════════════════════════════════════
   THEME TOKENS — Dark (default) + Light
   ═══════════════════════════════════════════════════════════ */
[data-theme="dark"] {
  --bg: #0d1117; --bg-alt: #161b22; --bg-card: #1c2128;
  --border: #30363d; --text: #c9d1d9; --text-dim: #8b949e;
  --text-bright: #fff; --blue: #58a6ff; --green: #3fb950;
  --red: #f85149; --yellow: #d29922; --orange: #f0883e;
  --purple: #bc8cff; --cyan: #39d2c0; --pink: #f778ba;
  --accent: #58a6ff; --accent-bg: rgba(88,166,255,.1);
  --font: 'JetBrains Mono','Cascadia Code','Fira Code','Consolas',monospace;
  --font-ui: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --radius: 6px; --transition: 150ms ease;
  --sidebar-w: 200px; --sidebar-icon-w: 56px;
  --header-h: 42px; --scrollbar: 6px;
}
[data-theme="light"] {
  --bg: #fff; --bg-alt: #f6f8fa; --bg-card: #fafbfc;
  --border: #d0d7de; --text: #24292f; --text-dim: #656d76;
  --text-bright: #1f2328; --blue: #0969da; --green: #1a7f37;
  --red: #cf222e; --yellow: #9a6700; --orange: #bd561d;
  --purple: #8250df; --cyan: #1b7c83; --pink: #bf3989;
  --accent: #0969da; --accent-bg: rgba(9,105,218,.08);
  --font: 'JetBrains Mono','Cascadia Code','Fira Code','Consolas',monospace;
  --font-ui: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --radius: 6px; --transition: 150ms ease;
  --sidebar-w: 200px; --sidebar-icon-w: 56px;
  --header-h: 42px; --scrollbar: 6px;
}

/* ═══════════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-ui);
  font-size:13px;line-height:1.5;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{cursor:pointer;font-family:inherit;font-size:inherit}
code,.code{font-family:var(--font)}
::placeholder{color:var(--text-dim);opacity:.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:var(--radius)}

/* Scrollbar */
::-webkit-scrollbar{width:var(--scrollbar);height:var(--scrollbar)}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}

/* Reduced motion */
@media(prefers-reduced-motion){
  *,*::before,*::after{transition-duration:0ms!important;animation-duration:0ms!important}
}

/* ═══════════════════════════════════════════════════════════
   SKIP LINK
   ═══════════════════════════════════════════════════════════ */
.skip-link{
  position:absolute;top:-100px;left:8px;z-index:9999;
  background:var(--accent);color:#000;padding:6px 12px;
  border-radius:var(--radius);font-weight:600;font-size:12px
}
.skip-link:focus{top:8px}

/* ═══════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════ */
.header{
  display:flex;align-items:center;height:var(--header-h);
  padding:0 12px;background:var(--bg-alt);
  border-bottom:1px solid var(--border);gap:10px;
  flex-shrink:0;position:relative;z-index:100;
}
.hamburger{
  display:none;background:none;border:none;color:var(--text);
  font-size:18px;padding:4px;border-radius:var(--radius);
  line-height:1;
}
.logo{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--text-bright);white-space:nowrap}
.logo span{color:var(--accent)}
.header .sep{width:1px;height:16px;background:var(--border)}
.status-indicator{display:flex;align-items:center;gap:5px;font-size:11px}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.status-dot.off{background:var(--red)}
.header-stats{display:flex;gap:12px;margin-left:auto;font-size:10px;color:var(--text-dim)}
.header-stats .s{display:flex;align-items:center;gap:3px}
.header-stats .s .n{color:var(--text-bright);font-weight:600;font-family:var(--font);font-size:11px}
.theme-btn{
  background:none;border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text-dim);cursor:pointer;padding:2px 7px;font-size:13px;
  line-height:1;transition:var(--transition);flex-shrink:0
}
.theme-btn:hover{color:var(--text-bright);border-color:var(--accent);background:var(--accent-bg)}

/* ═══════════════════════════════════════════════════════════
   LAYOUT: Sidebar + Main
   ═══════════════════════════════════════════════════════════ */
.layout{display:flex;height:calc(100% - var(--header-h))}

/* Sidebar */
.sidebar{
  width:var(--sidebar-w);background:var(--bg-alt);
  border-right:1px solid var(--border);flex-shrink:0;
  display:flex;flex-direction:column;transition:width var(--transition);
  overflow:hidden;
}
.sidebar-nav{
  display:flex;flex-direction:column;gap:2px;
  padding:8px;flex:1;overflow-y:auto;
}
.nav-item{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  border-radius:var(--radius);border:none;background:none;
  color:var(--text-dim);font-size:12px;cursor:pointer;
  transition:var(--transition);text-align:left;width:100%;
  white-space:nowrap;font-family:var(--font-ui);
}
.nav-item:hover{color:var(--text);background:var(--accent-bg)}
.nav-item.active{color:var(--accent);background:var(--accent-bg);font-weight:600}
.nav-item .icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav-item .label{overflow:hidden;text-overflow:ellipsis}
.sidebar-footer{
  padding:8px;border-top:1px solid var(--border);
  font-size:10px;color:var(--text-dim);text-align:center
}

/* Main content */
.main{flex:1;overflow-y:auto;padding:16px;min-width:0}
.main.loading{display:flex;align-items:center;justify-content:center}
.main.loading::after{
  content:'⏳ Loading…';color:var(--text-dim);font-family:var(--font);font-size:12px
}

/* ═══════════════════════════════════════════════════════════
   COMPONENTS
   ═══════════════════════════════════════════════════════════ */

/* Metric cards row */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.metric-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;
  transition:var(--transition);cursor:default;position:relative;
}
.metric-card:hover{transform:translateY(-2px);border-color:var(--accent)}

.metric-card .mc-value{
  font-family:var(--font);font-size:24px;font-weight:700;color:var(--text-bright);line-height:1.2
}
.metric-card .mc-label{font-size:11px;color:var(--text-dim);margin-top:2px}
.metric-card .mc-icon{position:absolute;top:10px;right:12px;font-size:18px;opacity:.25}

/* Section */
.section{margin-bottom:20px}
.section-title{
  font-size:13px;font-weight:600;color:var(--text-bright);
  margin-bottom:10px;display:flex;align-items:center;gap:6px
}
.section-title .badge{
  font-size:10px;background:var(--accent-bg);color:var(--accent);
  padding:1px 6px;border-radius:3px;font-weight:500;font-family:var(--font)
}

/* Cards */
.card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;margin-bottom:8px
}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--bg-alt);color:var(--text);font-size:12px;
  font-family:var(--font-ui);cursor:pointer;transition:var(--transition);
}
.btn:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.btn-primary:hover{background:var(--blue);color:#000}
.btn-sm{padding:3px 8px;font-size:11px}
.btn-icon{padding:4px;font-size:14px;line-height:1}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}

/* Table */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--bg-alt);color:var(--text-dim);font-weight:600;font-size:11px;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--accent-bg)}
tr.selected td{background:var(--accent-bg)}

/* Status badges */
.badge{
  display:inline-flex;align-items:center;gap:3px;
  padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600
}
.badge-green{background:rgba(63,185,80,.15);color:var(--green)}
.badge-red{background:rgba(248,81,73,.15);color:var(--red)}
.badge-yellow{background:rgba(210,153,34,.15);color:var(--yellow)}
.badge-blue{background:rgba(88,166,255,.15);color:var(--blue)}
.badge-gray{background:rgba(139,148,158,.15);color:var(--text-dim)}
.badge-purple{background:rgba(188,140,255,.15);color:var(--purple)}

/* Agent card */
.agent-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px;margin-bottom:8px
}
.agent-card .ac-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.agent-card .ac-name{font-weight:600;color:var(--text-bright);font-size:13px}
.agent-card .ac-task{font-size:11px;color:var(--text-dim);margin-bottom:6px}
.agent-card .ac-meta{display:flex;gap:12px;font-size:10px;color:var(--text-dim);flex-wrap:wrap}
.agent-card .ac-meta span{display:flex;align-items:center;gap:3px}

/* Activity feed */
.activity{font-size:12px}
.activity .entry{
  display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);
  align-items:flex-start
}
.activity .entry:last-child{border:none}
.activity .entry-time{font-family:var(--font);font-size:10px;color:var(--text-dim);white-space:nowrap;width:120px;flex-shrink:0}
.activity .entry-msg{word-break:break-word}
.activity .entry-lvl{font-size:10px;padding:0 4px;border-radius:2px;font-weight:600}

/* Project detail */
.project-detail{padding:10px 0}
.project-detail .pd-section{margin-bottom:14px}
.project-detail .pd-title{font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:4px}

/* Log viewer */
.log-viewer{font-family:var(--font);font-size:11px;line-height:1.6}
.log-viewer .log-entry{
  display:flex;gap:8px;padding:3px 6px;border-radius:2px
}
.log-viewer .log-entry:hover{background:var(--accent-bg)}
.log-viewer .log-time{color:var(--text-dim);flex-shrink:0;width:140px}

/* Alerts / Toasts */
.toast-container{
  position:fixed;top:52px;right:12px;z-index:9999;
  display:flex;flex-direction:column;gap:6px
}
.toast{
  padding:8px 14px;border-radius:var(--radius);font-size:12px;
  background:var(--bg-card);border:1px solid var(--border);
  box-shadow:0 4px 12px rgba(0,0,0,.3);animation:slideIn .2s ease;
  display:flex;align-items:center;gap:8px;max-width:360px
}
.toast-error{border-left:3px solid var(--red)}
.toast-success{border-left:3px solid var(--green)}
.toast-info{border-left:3px solid var(--blue)}
.toast .toast-close{
  background:none;border:none;color:var(--text-dim);font-size:14px;
  margin-left:auto;cursor:pointer;line-height:1;padding:2px
}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* Spinner */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Tag */
.tag{display:inline-block;padding:0 5px;border-radius:3px;background:var(--accent-bg);color:var(--accent);font-size:10px;font-weight:500;margin:1px}

/* Filter bar */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filter-bar input,.filter-bar select{
  padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg-alt);color:var(--text);font-size:12px;font-family:var(--font-ui)
}
.filter-bar input:focus,.filter-bar select:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* Settings toggle */
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid var(--border)
}
.setting-row:last-child{border:none}
.setting-row .s-label{font-size:12px}
.setting-row .s-desc{font-size:10px;color:var(--text-dim);margin-top:1px}
.toggle{
  width:36px;height:20px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg-alt);cursor:pointer;position:relative;transition:var(--transition);flex-shrink:0
}
.toggle.on{background:var(--green);border-color:var(--green)}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;
  border-radius:50%;background:var(--text-bright);transition:var(--transition)
}
.toggle.on::after{left:18px}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn .15s ease
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--bg-alt);border:1px solid var(--border);
  border-radius:var(--radius);max-width:600px;width:90%;
  max-height:80vh;overflow-y:auto;padding:20px
}
.modal-title{font-size:14px;font-weight:600;color:var(--text-bright);margin-bottom:12px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

/* Empty state */
.empty{text-align:center;padding:30px;color:var(--text-dim);font-size:12px}

/* Tabs for sub-navigation */
.tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:1px solid var(--border)}
.tab-btn{
  padding:6px 14px;border:none;background:none;color:var(--text-dim);
  font-size:12px;cursor:pointer;border-bottom:2px solid transparent;
  transition:var(--transition);font-family:var(--font-ui);margin-bottom:-1px
}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════════ */
@media(max-width:1023px){
  .sidebar{width:var(--sidebar-icon-w)}
  .nav-item .label{display:none}
  .nav-item{justify-content:center;padding:7px 4px}
}
@media(max-width:767px){
  .hamburger{display:block}
  .sidebar{
    position:fixed;top:var(--header-h);left:0;bottom:0;
    z-index:200;width:180px;transform:translateX(-100%);
    transition:transform .2s ease;
  }
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 20px rgba(0,0,0,.4)}
  .sidebar-backdrop{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);
    z-index:199;top:var(--header-h)
  }
  .sidebar-backdrop.show{display:block}
  .header .logo span{display:none}
  .header-stats .s span{display:none}
  .header-stats{gap:6px}
  .metrics{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:599px){
  .main{padding:10px}
  .metrics{grid-template-columns:1fr}
  .filter-bar{flex-direction:column}
  .agent-card .ac-meta{flex-direction:column;gap:4px}
}
</style>
</head>
<body>
<!-- Skip link -->
<a href="#main-content" class="skip-link">Skip to content</a>

<!-- ══════════ TOASTS ══════════ -->
<div id="toast-container" class="toast-container" aria-live="polite"></div>

<!-- ══════════ HEADER ══════════ -->
<header class="header">
  <button class="hamburger" id="hamburger" aria-label="Toggle navigation">☰</button>
  <div class="logo">⚡ Geno<span>Board</span></div>
  <div class="sep"></div>
  <div class="status-indicator" id="status-indicator">
    <span class="status-dot off" id="status-dot"></span>
    <span class="status-text" id="status-text">Connecting…</span>
  </div>
  <div class="header-stats" id="header-stats"></div>
  <button class="theme-btn" id="theme-btn" aria-label="Toggle theme">🌙</button>
</header>

<!-- ══════════ LAYOUT ══════════ -->
<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="sidebar-nav" id="sidebar-nav" role="tablist" aria-orientation="vertical">
      <button class="nav-item active" data-tab="dashboard" role="tab" aria-selected="true" aria-controls="panel-dashboard"><span class="icon">📊</span><span class="label">Dashboard</span></button>
      <button class="nav-item" data-tab="projects" role="tab" aria-selected="false" aria-controls="panel-projects"><span class="icon">📁</span><span class="label">Projects</span></button>
      <button class="nav-item" data-tab="agents" role="tab" aria-selected="false" aria-controls="panel-agents"><span class="icon">🤖</span><span class="label">Agents</span></button>
      <button class="nav-item" data-tab="models" role="tab" aria-selected="false" aria-controls="panel-models"><span class="icon">🧠</span><span class="label">Models</span></button>
      <button class="nav-item" data-tab="logs" role="tab" aria-selected="false" aria-controls="panel-logs"><span class="icon">📜</span><span class="label">Logs</span></button>
      <button class="nav-item" data-tab="settings" role="tab" aria-selected="false" aria-controls="panel-settings"><span class="icon">⚙️</span><span class="label">Settings</span></button>
      <button class="nav-item" data-tab="gateway" role="tab" aria-selected="false" aria-controls="panel-gateway"><span class="icon">🌐</span><span class="label">Gateway</span></button>
      <button class="nav-item" data-tab="sessions" role="tab" aria-selected="false" aria-controls="panel-sessions"><span class="icon">📋</span><span class="label">Sessions</span></button>
      <button class="nav-item" data-tab="safeguards" role="tab" aria-selected="false" aria-controls="panel-safeguards"><span class="icon">🛡️</span><span class="label">Safeguards</span></button>
    </div>
    <div class="sidebar-footer" id="sidebar-footer"></div>
  </nav>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <main class="main" id="main-content" role="main" aria-live="polite">
    <!-- Panels rendered by JS -->
  </main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   STATE MANAGER
   ═══════════════════════════════════════════════════════════ */
class StateManager {
  constructor(){this.state={};this.subs={};this._seq=0}
  get(k,d){const v=this.state;return k.split('.').reduce((o,p)=>(o&&o[p]!==undefined?o[p]:d),v)}
  set(k,v){
    const keys=k.split('.');const last=keys.pop();
    let o=this.state;for(const p of keys){if(!o[p])o[p]={};o=o[p]}
    o[last]=v;this._emit(k,v)
  }
  patch(k,partial){
    const cur=this.get(k,{});if(typeof cur==='object'){this.set(k,{...cur,...partial})}else{this.set(k,partial)}
  }
  on(key,fn){if(!this.subs[key])this.subs[key]=[];const id=++this._seq;this.subs[key].push({id,fn});return()=>{this.subs[key]=this.subs[key].filter(s=>s.id!==id)}}
  _emit(k,v){(this.subs[k]||[]).forEach(s=>s.fn(v,this.get(k)))
    // also emit wildcard
    ;(this.subs['*']||[]).forEach(s=>s.fn(k,v,this.state))}
}

const store=new StateManager();

/* ═══════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════ */
const $=(sel,ctx=document)=>ctx.querySelector(sel);
const $$=(sel,ctx=document)=>[...ctx.querySelectorAll(sel)];
const API=(path,opts)=>fetch('/orchestrator'+path,{headers:{Accept:'application/json'},...opts})
  .then(r=>{if(!r.ok)throw new Error(r.statusText);return r.json()})
  .catch(e=>{toast(e.message,'error');throw e});

function debounce(fn,ms=300){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
function fmtTime(iso){if(!iso)return'—';const d=new Date(iso);return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function fmtDate(iso){if(!iso)return'—';return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function relativeTime(iso){if(!iso)return'—';const diff=Date.now()-new Date(iso).getTime();const m=Math.floor(diff/60000);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h '+m%60+'m ago';return Math.floor(h/24)+'d ago'}

// Toast system
function toast(msg,type='info',duration=3500){
  const c=$('#toast-container');
  const el=document.createElement('div');
  el.className='toast toast-'+type;
  const icon={error:'❌',success:'✅',info:'ℹ️'}[type]||'ℹ️';
  el.innerHTML=`<span>${icon}</span><span>${esc(msg)}</span><button class="toast-close" aria-label="Dismiss">×</button>`;
  c.appendChild(el);
  el.querySelector('.toast-close').onclick=()=>el.remove();
  if(duration>0)setTimeout(()=>{if(el.parentNode)el.remove()},duration);
}

const CACHE={};
let refreshTimers={};

async function loadTabData(tab,fresh=false){
  // Check cache (5s ttl)
  if(!fresh&&CACHE[tab]&&Date.now()-CACHE[tab].ts<5000)return CACHE[tab].data;
  const maps={
    dashboard:['/api/status','/api/logs?limit=10','/api/live-agents','/api/models','/api/projects','/api/config'],
    projects:['/api/projects','/api/config'],
    agents:['/api/live-agents'],
    models:['/api/models'],
    logs:['/api/logs?limit=100'],
    settings:['/api/config','/api/status'],
    gateway:['/api/gateway'],
    safeguards:['/api/safeguard-log','/api/config','/api/status'],
    sessions:['/api/all'],
  };
  const paths=maps[tab]||[];
  const results=await Promise.allSettled(paths.map(p=>API(p)));
  const data={};
  results.forEach((r,i)=>{if(r.status==='fulfilled')data[paths[i]]=r.value});
  CACHE[tab]={data,ts:Date.now()};
  return data;
}

async function refreshHeader(){
  try{
    const [status,agents,models,projects]=await Promise.allSettled([
      API('/api/status'),API('/api/live-agents'),API('/api/models'),API('/api/projects')
    ]);
    const statsEl=$('#header-stats');
    let nModels='?',nAgents='?',nSessions='?',nProjects='?';
    if(agents.status==='fulfilled'){const a=agents.value;nAgents=a.agent_count!==undefined?a.agent_count:a.agents?.length||0;}
    if(status.status==='fulfilled'){const s=status.value;nProjects=s.projects_configured||0;}
    if(projects.status==='fulfilled')nProjects=projects.value.count||projects.value.projects?.length||0;
    if(models.status==='fulfilled')nModels=models.value.count||models.value.models?.length||0;

    // sessions from all endpoint
    try{
      const all=await API('/api/all');
      nSessions=all.sessions?.length||0;
    }catch(e){nSessions='?'}

    store.set('stats',{models:nModels,agents:nAgents,sessions:nSessions,projects:nProjects});
    statsEl.innerHTML=`
      <span class="s">🧠<span class="n">${nModels}</span><span>models</span></span>
      <span class="s">🤖<span class="n">${nAgents}</span><span>agents</span></span>

    `;

    $('#status-text').textContent='Connected';
  }catch(e){

    $('#status-text').textContent='Disconnected';
  }
}

window.loadProjectSessions=async function(){
  const project=$('#ps-project')?.value;
  const out=$('#ps-output');
  if(!project){out.innerHTML='<span style="color:var(--red)">Please select a project.</span>';return;}
  out.innerHTML='<span style="color:var(--text-dim)">Loading…</span>';
  try{
    const state=await API('/api/project-state?name='+encodeURIComponent(project)+'&t='+Date.now());
    if(!state||state.error){out.innerHTML='<span style="color:var(--red)">Error: '+(state?.error||'No data')+'</span>';return;}
    const sessions=state.sessions||[];
    const docs=state.docs||[];
    if(!sessions.length&&!docs.length){
      out.innerHTML='<span style="color:var(--text-dim)">No sessions or docs found for this project.</span>';
      return;
    }
    renderSessionTree(sessions,docs,project,out);
  } catch(e){out.innerHTML='<span style="color:var(--red)">Error: '+e.message+'</span>';}
};

function renderSessionTree(sessions,docs,project,out){
  const byParent={},byKey={};
  for(const s of sessions){
    byKey[s.session_key||s.id]=s;
    const pk=s.parent_session_key||'__root__';
    if(!byParent[pk]) byParent[pk]=[];
    byParent[pk].push(s);
  }
  const roots=byParent['__root__']||[];
  let html='<div style="display:flex;gap:16px;flex-wrap:wrap">';
  html+='<div style="flex:2;min-width:350px">';
  html+='<div class="section-mark" style="margin-top:0">Sessions ('+sessions.length+')</div>';
  html+='<div id="sessions-tree">';
  const visited=new Set();
  function walk(nodes,depth){
    if(!nodes||!nodes.length) return '';
    let h='<div style="'+(depth>0?'margin-left:'+(depth*16)+'px;':'')+'">';
    for(const s of nodes){
      const k=s.session_key||s.id;
      if(visited.has(k)) continue;
      visited.add(k);
      const children=byParent[k];
      const hasChild=children&&children.length>0;
      const st=s.status||'unknown';
      const bc=st==='complete'?'success':st==='failed'?'error':st==='running'||st==='in_progress'?'warn':'info';
      const dur=s.duration?formatDur(s.duration):calcDur(s.started_at||s.start_time,s.ended_at||s.end_time);
      const startFmt=fmtTime(s.started_at||s.start_time);
      h+='<div class="session-row" data-sk="'+escAttr(k)+'" onclick="toggleSessionDetail(this,\''+escAttr(k)+'\')" style="padding:6px 8px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:4px">';
      h+='<span style="width:14px;flex-shrink:0;text-align:center;font-size:9px;color:var(--text-dim)">'+(hasChild?'▶':'')+'</span>';
      h+='<span style="width:80px;flex-shrink:0;font-size:11px;color:var(--text-dim)">'+escHtml(s.agent||'?')+'</span>';
      h+='<span class="badge badge-'+bc+'" style="width:60px;text-align:center">'+st+'</span>';
      h+='<span style="flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escHtml(s.goal||s.task||'—')+'</span>';
      h+='<span style="width:110px;flex-shrink:0;font-size:10px;color:var(--text-dim);text-align:right">'+startFmt+'</span>';
      h+='<span style="width:50px;flex-shrink:0;font-size:10px;color:var(--text-dim);text-align:right">'+(dur||'—')+'</span>';
      h+='</div>';
      h+='<div class="session-detail" id="sdetail-'+k.replace(/[^a-z0-9]/gi,'_')+'" style="display:none;padding:10px 12px 14px 28px;background:var(--bg);border-bottom:1px solid var(--border);font-size:11px">Click to load details.</div>';
      if(hasChild) h+=walk(children,depth+1);
    }
    h+='</div>';
    return h;
  }
  html+=walk(roots,0);
  // Orphans
  const orphaned=[];
  const seen2=new Set();
  for(const s of sessions){
    const k=s.session_key||s.id;
    const pk=s.parent_session_key;
    if(pk&&pk!=='__root__'&&!byKey[pk]&&!seen2.has(k)){seen2.add(k);orphaned.push(s);}
  }
  if(orphaned.length){
    html+='<div style="margin-top:8px;font-size:11px;color:var(--text-dim);padding:4px 8px">⚠️ '+orphaned.length+' orphan session(s)</div>';
    html+=walk(orphaned,0);
  }
  html+='</div></div>';
  // Right column: docs
  html+='<div style="flex:1;min-width:200px"><div class="section-mark" style="margin-top:0">Project Docs</div>';
  if(docs.length){
    html+='<div style="display:flex;flex-direction:column;gap:4px">';
    for(const d of docs){
      const icon=d.is_md?'📄':d.is_json?'📋':'📎';
      html+='<a href="#" onclick="event.preventDefault();loadProjectDoc(\''+project+'\',\''+d.name+'\')" style="color:var(--text);text-decoration:none;font-size:12px;padding:2px 4px;border-radius:3px;display:flex;align-items:center;gap:6px">'+
        '<span>'+icon+'</span><span>'+d.name+'</span><span style="margin-left:auto;font-size:10px;color:var(--text-dim)">'+fmtSize(d.size)+'</span></a>';
    }
    html+='</div>';
  } else html+='<p style="color:var(--text-dim)">No docs.</p>';
  html+='</div></div>';
  out.innerHTML=html;
  window._sessionData=window._sessionData||{};
  window._sessionData[project]=sessions;
}

async function loadSessionDetail(sk,el){

      }
      if(s) break;
    }
    if(!s){el.innerHTML='<span style="color:var(--red)">Session not found</span>';return;}
    const dur=s.duration?formatDur(s.duration):calcDur(s.started_at||s.start_time,s.ended_at||s.end_time);
    const hasParent=!!(s.parent_session_key&&s.parent_session_key!=='__root__');
    const tags=Array.isArray(s.tags)?s.tags:[];

    html+='<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px">';
    html+='<div><strong style="font-size:13px">'+escHtml(s.goal||s.task||'Untitled')+'</strong>';

    const bc=s.status==='complete'?'success':s.status==='failed'?'error':s.status==='running'||s.status==='in_progress'?'warn':'info';
    html+='<span class="badge badge-'+bc+'">'+(s.status||'unknown')+'</span>';
    html+='</div>';
    html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-bottom:8px">';
    html+=infoRow('Agent',s.agent||'—');
    html+=infoRow('Model',s.model||'—');
    html+=infoRow('Started',fmtTime(s.started_at||s.start_time));
    html+=infoRow('Duration',dur||'—');
    html+=infoRow('Task',s.task||'—');
    if(s.original_prompt) html+=infoRow('Original Prompt',s.original_prompt,true);
    if(hasParent) html+='<div style="grid-column:1/-1;margin-top:4px">🔗 <strong>Parent Session:</strong> <code style="font-size:10px">'+escHtml(s.parent_session_key)+'</code></div>';
    html+='</div>';

      html+='</div>';

      html+='<pre style="background:var(--bg-alt);padding:6px 8px;border-radius:4px;font-size:10px;margin-top:4px;overflow:auto;max-height:120px">'+escHtml(s.notes)+'</pre></div>';
    }
    if(s.links&&Object.keys(s.links).length){
      html+='<div><strong style="font-size:11px">🔗 Links:</strong><div style="margin-top:4px">';
      for(const [lk,lv] of Object.entries(s.links)) html+='<div style="font-size:10px;color:var(--text-dim);padding:1px 0">'+escHtml(lk)+': <code>'+escHtml(String(lv).slice(0,80))+'</code></div>';

function infoRow(label,val,wide){
  const col=wide?'1/-1':'1fr';
  return '<div style="grid-column:'+col+'"><span style="font-size:10px;color:var(--text-dim);display:block">'+label+'</span><span>'+val+'</span></div>';
}

function calcDur(start,end){
  if(!start||!end) return null;
  const s=new Date(start).getTime(), e=new Date(end).getTime();
  if(isNaN(s)||isNaN(e)||e<s) return null;
  const ms=e-s;
  if(ms<60000) return Math.round(ms/1000)+'s';
  if(ms<3600000) return Math.floor(ms/60000)+'m '+Math.round((ms%60000)/1000)+'s';
  return Math.floor(ms/3600000)+'h '+Math.round((ms%3600000)/60000)+'m';
}

function formatDur(d){
  if(!d) return null;
  const m=d.match(/(\d+)\s*(s|sec|m|min|h|hr)/i);
  return m?m[1]+m[2].charAt(0):d;
}

function fmtTime(ts){
  if(!ts) return '—';
  try{const d=new Date(ts);if(isNaN(d.getTime())) return ts.slice(0,16);return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return String(ts).slice(0,16);}
}

let currentTab='dashboard';

function activateTab(tabId){
  if(currentTab===tabId&&renderedTabs.has(tabId))return;
  currentTab=tabId;

  // Update nav
  $$('.nav-item').forEach(el=>{
    const active=el.dataset.tab===tabId;
    el.classList.toggle('active',active);
    el.setAttribute('aria-selected',active?'true':'false');
  });

  // Update hash
  if(location.hash!=='#'+tabId)history.replaceState(null,'','#'+tabId);

  const main=$('#main-content');
  main.className='main loading';

  loadTabData(tabId).then(data=>{
    renderActiveTab(tabId,data);
    renderedTabs.add(tabId);
    main.className='main';
  }).catch(()=>{
    main.className='main';
    toast('Failed to load '+tabId+' data','error');
  });
}

function renderActiveTab(tabId,data){
  const main=$('#main-content');
  switch(tabId){
    case 'dashboard': main.innerHTML=renderDashboard(data);break;
    case 'projects': main.innerHTML=renderProjects(data);break;
    case 'agents': main.innerHTML=renderAgents(data);break;
    case 'models': main.innerHTML=renderModels(data);break;
    case 'logs': main.innerHTML=renderLogs(data);break;
    case 'settings': main.innerHTML=renderSettings(data);break;
    case 'gateway': main.innerHTML=renderGateway(data);break;
    case 'safeguards': main.innerHTML=renderSafeguards(data);break;
    case 'sessions': main.innerHTML=renderProjectSessions(data);break;
  }

  // Update header stats with sessions count after dashboard renders
  if(tabId==='dashboard'){
    (async()=>{
      try{const a=await API('/api/all');const el=$('#metric-sessions');if(el)el.textContent=a.sessions?.length||0}catch(e){}
    })();
  }
}

function refreshTab(tabId){
  loadTabData(tabId,true).then(data=>renderActiveTab(tabId,data));
}

let sseSource=null;

function toggleSSE(start){
  const out=$('#sse-output');
  if(!start&&sseSource){
    sseSource.close();sseSource=null;
    $('#sse-start-btn').disabled=false;$('#sse-stop-btn').disabled=true;
    toast('SSE disconnected','info');
    return;
  }
  if(start&&!sseSource){
    out.innerHTML='<div style="padding:8px;color:var(--text-dim)"><span class="spinner"></span> Connecting to SSE…</div>';
    sseSource=new EventSource('/orchestrator/api/sse/live-sessions');
    sseSource.onmessage=e=>{
      try{
        const d=JSON.parse(e.data);
        const ts=fmtTime(new Date().toISOString());
        const entry=document.createElement('div');
        entry.className='log-entry';
        entry.innerHTML=`<span class="log-time">${ts}</span><span style="color:var(--green)">SSE</span><span>${esc(JSON.stringify(d).slice(0,500))}</span>`;
        out.insertBefore(entry,out.firstChild);
        // Keep max 200 entries
        while(out.children.length>200)out.removeChild(out.lastChild);
      }catch(e){/* ignore parse errors */}
    };
    sseSource.onerror=()=>{
      const entry=document.createElement('div');
      entry.className='log-entry';
      entry.innerHTML=`<span class="log-time">${fmtTime(new Date().toISOString())}</span><span style="color:var(--red)">SSE</span><span>Connection error — will auto-reconnect</span>`;
      out.insertBefore(entry,out.firstChild);
    };
    $('#sse-start-btn').disabled=true;$('#sse-stop-btn').disabled=false;
    toast('SSE connected','success');
  }
}

function clearSSE(){
  const out=$('#sse-output');
  if(out)out.innerHTML='<div class="empty">Console cleared.</div>';
}

        </div>
      </div>

      <div class="section">
        <div class="section-title">Model Routing</div>
        <div class="card" style="font-size:11px">
          ${Object.entries(docs.model_routing||{}).map(([cat,models])=>`
            <div style="margin-bottom:4px"><span style="color:var(--text-dim);font-weight:600">${cat}:</span> ${models.map(m=>`<span class="tag">${esc(m)}</span>`).join(' ')||'<span style="color:var(--text-dim)">none</span>'}</div>
          `).join('')}
        </div>
      </div>
    </div>`;
  }catch(e){
    main.innerHTML=renderProjects(data); // fallback
    toast('Failed to load project detail: '+e.message,'error');
  }
}

/* ═══════════════════════════════════════════════════════════
   CONFIG TOGGLES & QUICK ACTIONS
   ═══════════════════════════════════════════════════════════ */
async function toggleConfig(key){
  try{
    const cfg=await API('/api/config');
    let body={};
    if(key==='free_only_mode')body={free_only_mode:!cfg.free_only_mode};
    else if(key==='safeguards_enabled')body={safeguards:{...cfg.safeguards,enabled:!cfg.safeguards?.enabled}};
    else if(key==='auto_recover')body={safeguards:{...cfg.safeguards,auto_recover:!cfg.safeguards?.auto_recover}};
    await API('/api/config',{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});
    toast('Config updated','success');
    refreshTab('settings');
  }catch(e){toast('Failed to update config','error')}
}

async function quickAction(action){
  try{
    toast('Running '+action+'…','info',10000);
    if(action==='doctor'){await API('/api/quick-action',{method:'POST',body:JSON.stringify({action:'doctor'}),headers:{'Content-Type':'application/json'}})}
    else if(action==='auto-populate'){await API('/api/auto-populate',{method:'POST'})}
    else if(action==='fix-docs'){await API('/api/quick-action',{method:'POST',body:JSON.stringify({action:'fix-docs'}),headers:{'Content-Type':'application/json'}})}
    toast(action+' completed','success');
    refreshTab(currentTab);
  }catch(e){toast(action+' failed: '+e.message,'error')}
}

/* ═══════════════════════════════════════════════════════════
   HASH ROUTING
   ═══════════════════════════════════════════════════════════ */
function routeFromHash(){
  const hash=location.hash.slice(1)||'dashboard';
  const valid=['dashboard','projects','agents','models','logs','settings','gateway','safeguards','sessions'];
  return valid.includes(hash)?hash:'dashboard';
}

/* ═══════════════════════════════════════════════════════════
   THEME TOGGLE
   ═══════════════════════════════════════════════════════════ */
function initTheme(){
  const saved=localStorage.getItem('genorboard-theme')||'dark';
  document.documentElement.setAttribute('data-theme',saved);
  $('#theme-btn').textContent=saved==='dark'?'🌙':'☀️';
}

function toggleTheme(){
  const current=document.documentElement.getAttribute('data-theme');
  const next=current==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('genorboard-theme',next);
  $('#theme-btn').textContent=next==='dark'?'🌙':'☀️';
}

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded',()=>{
  initTheme();
  $('#theme-btn').onclick=toggleTheme;

  // Nav clicks
  $$('.nav-item').forEach(el=>{
    el.onclick=()=>activateTab(el.dataset.tab);
  });

  // Hash change
  window.addEventListener('hashchange',()=>{
    const tab=routeFromHash();
    if(tab!==currentTab)activateTab(tab);
  });

  // Hamburger
  $('#hamburger').onclick=()=>{
    $('#sidebar').classList.toggle('open');
    $('#sidebar-backdrop').classList.toggle('show');
  };
  $('#sidebar-backdrop').onclick=()=>{
    $('#sidebar').classList.remove('open');
    $('#sidebar-backdrop').classList.remove('show');
  };

  // Initial route
  const tab=routeFromHash();
  activateTab(tab);

  // Header refresh
  refreshHeader();
  setInterval(refreshHeader,15000);

  // Periodic tab refresh (auto-refresh for dashboard, agents, gateway)
  setInterval(()=>{
    if(currentTab==='dashboard'||currentTab==='agents'||currentTab==='gateway'){
      refreshTab(currentTab);
    }
  },10000);

  // Footer version
  $('#sidebar-footer').textContent='GenorBoard v2';
});
</script>
