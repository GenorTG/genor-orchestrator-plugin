<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Error Feed | Genor's Orchestrator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117; color: #c9d1d9; padding: 20px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  h1 small { font-size: 0.8rem; color: #8b949e; font-weight: normal; }
  .controls { margin-bottom: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls select, .controls input { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; }
  .controls button { background: #238636; border: none; color: #fff; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .controls button:hover { background: #2ea043; }
  .controls label { font-size: 0.85rem; color: #8b949e; }
  .stats { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 16px; text-align: center; }
  .stat .num { font-size: 1.3rem; font-weight: 600; color: #f0f6fc; }
  .stat .lbl { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
  .error-entry { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; }
  .error-entry:hover { border-color: #58a6ff; }
  .error-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .error-timestamp { font-size: 0.8rem; color: #8b949e; }
  .error-project { background: #1f6feb; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 500; }
  .error-phase { background: #21262d; color: #d2a8ff; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin-left: 4px; }
  .error-message { font-size: 0.9rem; margin: 4px 0; color: #f85149; word-break: break-word; }
  .error-step { font-size: 0.8rem; color: #8b949e; margin: 2px 0; }
  .error-action { font-size: 0.8rem; color: #7ee787; margin: 2px 0; }
  .empty { text-align: center; padding: 40px; color: #8b949e; }
  .loading { text-align: center; padding: 40px; color: #8b949e; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 0.7rem; font-weight: 500; }
  .badge-warn { background: #d29922; color: #000; }
  .badge-error { background: #f85149; color: #fff; }
  .auto-refresh { font-size: 0.75rem; color: #8b949e; margin-left: auto; }
</style>
</head>
<body>
<h1>⚠️ Error Feed <small>structured error log</small></h1>

<div class="controls">
  <label>View:</label>
  <select id="viewSelect">
    <option value="global">Global (all projects)</option>
    <option value="project">Per-project</option>
  </select>
  <select id="projectSelect" disabled>
    <option value="">Select project...</option>
  </select>
  <label>Limit:</label>
  <input type="number" id="limitInput" value="50" min="5" max="200" style="width:60px">
  <button id="refreshBtn">🔄 Refresh</button>
  <label class="auto-refresh"><input type="checkbox" id="autoRefresh" checked> Auto-refresh (10s)</label>
</div>

<div class="stats">
  <div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">Total Errors</div></div>
  <div class="stat"><div class="num" id="projectCount">0</div><div class="lbl">Projects</div></div>
</div>

<div id="errorList">
  <div class="loading">Loading errors...</div>
</div>

<script src="/orchestrator/store.js"></script>
<script>
const errorList = document.getElementById('errorList');
const totalCount = document.getElementById('totalCount');
const projectCount = document.getElementById('projectCount');
const viewSelect = document.getElementById('viewSelect');
const projectSelect = document.getElementById('projectSelect');
const limitInput = document.getElementById('limitInput');
const refreshBtn = document.getElementById('refreshBtn');
const autoRefresh = document.getElementById('autoRefresh');

let autoTimer = null;

async function loadErrors() {
  const view = viewSelect.value;
  const limit = limitInput.value || 50;
  let url;

  if (view === 'global') {
    url = `/global-errors?limit=${limit}`;
  } else {
    const project = projectSelect.value;
    if (!project) { errorList.innerHTML = '<div class="empty">Select a project to view errors</div>'; return; }
    url = `/project-errors?project=${encodeURIComponent(project)}&limit=${limit}`;
  }

  try {
    const data = await store.api(url);
    renderErrors(data);
  } catch (err) {
    errorList.innerHTML = `<div class="empty">Failed to load: ${err.message}</div>`;
  }
}

async function loadProjects() {
  try {
    const data = await store.api('/projects');
    const sel = projectSelect;
    sel.innerHTML = '<option value="">Select project...</option>';
    for (const p of (data.projects || [])) {
      sel.innerHTML += `<option value="${p.name}">${p.name} (${p.session_count} sessions)</option>`;
    }
  } catch {}
}

function renderErrors(data) {
  const errors = data.errors || [];
  if (errors.length === 0) {
    errorList.innerHTML = '<div class="empty">✅ No errors logged. Everything looks clean!</div>';
    totalCount.textContent = '0';
    projectCount.textContent = '0';
    return;
  }

  const projects = new Set();
  let html = '';
  for (const err of errors) {
    if (err.project) projects.add(err.project);
    const ts = err.timestamp ? new Date(err.timestamp).toLocaleString() : '?';
    const phase = err.phase || '?';
    const step = err.step || '?';
    const errorMsg = err.error || 'Unknown error';
    const action = err.action_taken || 'No action recorded';
    const isError = errorMsg.toLowerCase().includes('fail') || errorMsg.toLowerCase().includes('error');
    html += `<div class="error-entry">
      <div class="error-header">
        <div>
          ${err.project ? `<span class="error-project">${escapeHtml(err.project)}</span>` : ''}
          <span class="error-phase">${escapeHtml(phase)}</span>
          ${isError ? '<span class="badge badge-error">ERROR</span>' : '<span class="badge badge-warn">WARN</span>'}
        </div>
        <div class="error-timestamp">${escapeHtml(ts)}</div>
      </div>
      <div class="error-message">${escapeHtml(errorMsg)}</div>
      <div class="error-step">Step: ${escapeHtml(step)}</div>
      <div class="error-action">✅ ${escapeHtml(action)}</div>
    </div>`;
  }
  errorList.innerHTML = html;
  totalCount.textContent = errors.length;
  projectCount.textContent = projects.size;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

viewSelect.addEventListener('change', () => {
  projectSelect.disabled = viewSelect.value !== 'project';
  loadErrors();
});

projectSelect.addEventListener('change', loadErrors);
refreshBtn.addEventListener('click', () => { loadErrors(); loadProjects(); });

autoRefresh.addEventListener('change', () => {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  if (autoRefresh.checked) autoTimer = setInterval(loadErrors, 10000);
});

loadProjects();
loadErrors();
if (autoRefresh.checked) autoTimer = setInterval(loadErrors, 10000);
</script>
</body>
</html>
